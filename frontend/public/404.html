<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | ClickClickJob.com</title>
  <meta name="description" content="The page you are looking for could not be found.">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }
    header {
      padding: 1rem 0;
      background-color: white;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .blue {
      color: #2563eb;
    }
    .orange {
      color: #f97316;
    }
    main {
      padding: 3rem 0;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
      color: #4b5563;
    }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      border-radius: 0.375rem;
      text-decoration: none;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      transition: background-color 150ms;
    }
    .cta:hover {
      background-color: #1d4ed8;
    }
    .secondary {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: white;
      color: #2563eb;
      border: 1px solid #d1d5db;
      font-weight: 600;
      border-radius: 0.375rem;
      text-decoration: none;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      margin-left: 0.5rem;
      transition: background-color 150ms;
    }
    .secondary:hover {
      background-color: #f9fafb;
    }
    .actions {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">
        <a href="/" style="text-decoration: none;">
          <span class="blue">ClickClick</span><span class="orange">Job.com</span>
        </a>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>Sorry, we couldn't find the page you're looking for.</p>
      <div class="actions">
        <a href="/" class="cta">Go Back Home</a>
        <a href="/jobs" class="secondary">Browse Jobs</a>
      </div>
      <p>Looking for something specific?</p>
      <div>
        <a href="/categories/data-entry" style="color: #2563eb; margin: 0 0.5rem;">Data Entry Jobs</a>
        <a href="/categories/administrative" style="color: #2563eb; margin: 0 0.5rem;">Administrative Jobs</a>
        <a href="/categories/customer-service" style="color: #2563eb; margin: 0 0.5rem;">Customer Service Jobs</a>
      </div>
    </div>
  </main>
</body>
</html>
