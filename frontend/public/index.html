<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickClickJob.com | Remote Jobs</title>
  <meta name="description" content="Find verified remote data entry & administrative jobs. 100+ work-from-home opportunities updated daily. No experience options available.">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }
    header {
      padding: 1rem 0;
      background-color: white;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .blue {
      color: #2563eb;
    }
    .orange {
      color: #f97316;
    }
    main {
      padding: 3rem 0;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
      color: #4b5563;
    }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      border-radius: 0.375rem;
      text-decoration: none;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      transition: background-color 150ms;
    }
    .cta:hover {
      background-color: #1d4ed8;
    }
    .loading {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #6b7280;
    }
  </style>
  <script>
    // Redirect to the actual Next.js app after a short delay
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.location.href = '/jobs';
      }, 1500);
    });
  </script>
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">
        <span class="blue">ClickClick</span><span class="orange">Job.com</span>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <h1>Find Remote Data Entry & Administrative Jobs</h1>
      <p>100+ verified remote opportunities updated daily</p>
      <a href="/jobs" class="cta">Browse Jobs</a>
      <div class="loading">Loading application...</div>
    </div>
  </main>
</body>
</html>
