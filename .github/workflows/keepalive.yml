name: Keepalive

# GitHub auto-disables ALL scheduled workflows after 60 days of repository
# inactivity. This repo goes quiet for weeks at a time, which killed the
# Main Job Scraper cron. Pushing an empty commit once a month resets the
# 60-day timer so the scrapers keep running untouched.
#
# [skip ci] on the commit keeps it from triggering a Vercel rebuild.

on:
  schedule:
    - cron: '0 5 1 * *'  # 1st of every month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(keepalive): reset 60-day scheduled-workflow timer [skip ci]"
          git push
