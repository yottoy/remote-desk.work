name: Scrape Remote Admin/Data Entry Jobs

on:
  # schedule:
  #   - cron: '0 */12 * * *'  # Run every 12 hours - DISABLED to reduce artifact storage
  workflow_dispatch:  # Allow manual runs only

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.3
          pip install pandas
          # Install both package variants
          pip install python-jobspy
          pip install jobspy
          # Extra diagnostic info
          echo "=== INSTALLED PACKAGES ==="
          pip list
          echo "=== PYTHON VERSION ==="
          python --version
          echo "=== CHECKING JOBSPY ==="
          python -c "import importlib.util; print('jobspy module exists:', importlib.util.find_spec('jobspy') is not None); print('python_jobspy module exists:', importlib.util.find_spec('python_jobspy') is not None)"
          # Create directories
          mkdir -p results logs
          npm ci
          
      - name: Run job scraper
        run: |
          # Make sure the script is executable
          chmod +x direct_scraper.py
          node run-all-scrapers.js
          
      - name: Check results
        run: |
          echo "Job scraping completed"
          echo "Checking results files..."
          ls -la results/
          if [ -f "combined-results.json" ]; then
            echo "Contents of combined-results.json:"
            cat combined-results.json | jq '.jobs | length'
          else
            echo "combined-results.json not found!"
            if [ -f "results/combined-results.json" ]; then
              echo "Found in results directory instead"
              cat results/combined-results.json | jq '.jobs | length'
            fi
          fi
          
      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: job-scraping-results
          path: |
            combined-results.json
            results/
            logs/
          retention-days: 1
          if-no-files-found: warn 