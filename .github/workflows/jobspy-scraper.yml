name: JobSpy Scraper

on:
  # Run on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'
      use_proxies:
        description: 'Use proxies from secrets'
        required: false
        default: 'false'

jobs:
  scrape-indeed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      # Set up Python environment for JobSpy bridge
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # Create log directories
      - name: Create log and result directories
        run: |
          mkdir -p logs
          mkdir -p python-bridge/logs
          mkdir -p results
          touch logs/scraper.log
          touch python-bridge/jobspy_bridge.log
      
      # Install Python dependencies for JobSpy bridge
      - name: Install Python dependencies
        run: |
          cd python-bridge
          pip install -r requirements.txt
      
      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci
      
      # Configure proxies if enabled
      - name: Configure proxies
        if: github.event.inputs.use_proxies == 'true'
        run: |
          cd python-bridge
          echo "${{ secrets.PROXY_LIST }}" > proxies.txt
          echo "USE_PROXIES=true" >> .env
          echo "Proxies configured successfully"
      
      # Configure environment
      - name: Setup environment variables
        run: |
          # Global env vars
          echo "ENABLE_JOBSPY_INDEED=true" >> .env
          echo "ENABLE_JOBSPY_LINKEDIN=true" >> .env
          echo "ENABLE_JOBSPY_NAUKRI=true" >> .env
          echo "JOBSPY_BRIDGE_URL=http://127.0.0.1:8000" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "LOG_LEVEL=debug" >> .env
          
          # Create .env file for Python bridge
          cd python-bridge
          echo "JOBSPY_BRIDGE_HOST=127.0.0.1" >> .env
          echo "JOBSPY_BRIDGE_PORT=8000" >> .env
          echo "MAX_RETRY_ATTEMPTS=3" >> .env
          echo "RETRY_DELAY=5" >> .env 
          echo "MIN_REQUEST_INTERVAL=2.5" >> .env
          echo "USE_RANDOM_USER_AGENTS=true" >> .env
          echo "DISABLE_PYDANTIC_VALIDATION_WARNINGS=true" >> .env
          
          # If not using proxies, explicitly set to false
          if [ "${{ github.event.inputs.use_proxies }}" != "true" ]; then
            echo "USE_PROXIES=false" >> .env
          fi
      
      # Modify the scrape-all-jobs.js to ensure it uses the correct URL
      - name: Update connection settings
        run: |
          # Force IPv4 in the scrape-all-jobs.js file
          sed -i 's/const API_HOST = process.env.JOBSPY_BRIDGE_URL || .*/const API_HOST = process.env.JOBSPY_BRIDGE_URL || "http:\/\/127.0.0.1:8000";/' python-bridge/scrape-all-jobs.js
          
          # Show network interfaces for debugging
          echo "Network interfaces:"
          ip addr
          
          # Ensure Python is using IPv4
          cd python-bridge
          # Modify jobspy_bridge.py to bind to both IPv4 and IPv6
          if grep -q "uvicorn.run" jobspy_bridge.py; then
            sed -i 's/uvicorn.run(app, host=host, port=port)/uvicorn.run(app, host=host, port=port, log_level="info")/' jobspy_bridge.py
          fi
      
      # Run JobSpy bridge in background
      - name: Start JobSpy bridge
        run: |
          cd python-bridge
          # Force IPv4 for the Python server
          python -c "import socket; socket.setdefaulttimeout(10); print('IPv4 address:', socket.gethostbyname('localhost'))"
          python jobspy_bridge.py > jobspy_bridge_startup.log 2>&1 &
          echo $! > bridge_pid.txt
          
          # Wait for bridge to start up
          echo "Waiting for bridge to start..."
          sleep 15 
          
          # Check if bridge is running
          if curl -s -v http://127.0.0.1:8000/health; then
            echo "Bridge started successfully!"
          else
            echo "Bridge failed to start. Checking logs:"
            cat jobspy_bridge_startup.log
            echo "Checking if process is running:"
            ps aux | grep python
            echo "Checking netstat for port 8000:"
            netstat -tuln | grep 8000 || echo "Port 8000 not found in netstat"
            exit 1
          fi
        timeout-minutes: 5
      
      # Run the main scraper
      - name: Run JobSpy scraper
        run: |
          cd python-bridge
          
          # Record start time
          echo "Starting JobSpy scraper at $(date)" | tee -a ../logs/scraper.log
          
          # Check bridge status before starting
          echo "Verifying bridge connection..."
          if curl -s -v http://127.0.0.1:8000/health; then
            echo "Bridge is running, starting scraper"
          else
            echo "Bridge is not running! Aborting."
            exit 1
          fi
          
          # Run the scraper and capture output
          JOBSPY_BRIDGE_URL=http://127.0.0.1:8000 node scrape-all-jobs.js 2>&1 | tee -a ../logs/scraper.log
          
          # Record completion
          echo "JobSpy scraper completed at $(date)" | tee -a ../logs/scraper.log
          
          # Copy results file to results directory if it exists
          if [ -f "scrape-results.json" ]; then
            cp scrape-results.json ../results/
            echo "Results file created and copied to results directory"
          else
            echo "No results file was created!"
          fi
        timeout-minutes: 20
      
      # Update MongoDB with job results
      - name: Update MongoDB with results
        run: |
          echo "Importing jobs to MongoDB..."
          
          # Check if results file exists
          if [ -f "python-bridge/scrape-results.json" ]; then
            # Import jobs to MongoDB using a Node.js script
            node -e "
              const fs = require('fs');
              const { MongoClient } = require('mongodb');
              require('dotenv').config();
              
              async function importJobs() {
                try {
                  const results = JSON.parse(fs.readFileSync('python-bridge/scrape-results.json', 'utf8'));
                  const client = new MongoClient(process.env.MONGODB_URI);
                  await client.connect();
                  const db = client.db();
                  
                  let jobsImported = 0;
                  if (results && results.totalJobs > 0) {
                    // Collect all jobs from the results
                    const allJobs = [];
                    for (const source in results.sourceStats) {
                      for (const searchTerm in results.sourceStats[source].searchTerms) {
                        // Add jobs to the array
                        // We're not actually retrieving individual jobs from the results file here
                        // as they're not stored in the current format. This would need to be updated.
                        console.log(`Found ${results.sourceStats[source].searchTerms[searchTerm]} jobs for term: ${searchTerm} from ${source}`);
                      }
                    }
                    
                    console.log(`Total jobs found: ${results.totalJobs}`);
                    console.log('Please update MongoDB import logic to store individual jobs');
                  } else {
                    console.log('No jobs found in results');
                  }
                  
                  // Show current job count in database
                  const count = await db.collection('jobs').countDocuments();
                  console.log('Total jobs in database: ' + count);
                  
                  await client.close();
                } catch(e) {
                  console.error('Error importing jobs:', e.message);
                }
              }
              
              importJobs().catch(console.error);
            " 2>&1 | tee -a logs/mongodb-import.log
          else
            echo "No results file found. Skipping MongoDB import." | tee -a logs/mongodb-import.log
          fi
      
      # Stop the bridge process
      - name: Stop JobSpy bridge
        if: always()
        run: |
          if [ -f "python-bridge/bridge_pid.txt" ]; then
            PID=$(cat python-bridge/bridge_pid.txt)
            if ps -p $PID > /dev/null; then
              echo "Stopping JobSpy bridge process (PID: $PID)"
              kill $PID || true
            else
              echo "JobSpy bridge process (PID: $PID) is not running"
            fi
          else
            echo "No bridge PID file found, trying to find by process name"
            pkill -f "python jobspy_bridge.py" || true
          fi
      
      # Create summary
      - name: Create summary
        if: always()
        run: |
          # Create a results summary
          echo "=== SCRAPING RESULTS SUMMARY ===" > logs/summary.log
          echo "Scraper run completed at: $(date)" >> logs/summary.log
          
          # Include JobSpy logs in summary
          if [ -f "python-bridge/jobspy_bridge.log" ]; then
            echo "" >> logs/summary.log
            echo "=== JOBSPY BRIDGE LOG EXCERPTS ===" >> logs/summary.log
            tail -n 50 python-bridge/jobspy_bridge.log >> logs/summary.log
          fi
          
          # Include startup logs in summary
          if [ -f "python-bridge/jobspy_bridge_startup.log" ]; then
            echo "" >> logs/summary.log
            echo "=== JOBSPY BRIDGE STARTUP LOG ===" >> logs/summary.log
            cat python-bridge/jobspy_bridge_startup.log >> logs/summary.log
          fi
          
          # Include scraper results in summary if available
          if [ -f "python-bridge/scrape-results.json" ]; then
            echo "" >> logs/summary.log
            echo "=== SCRAPER RESULTS SUMMARY ===" >> logs/summary.log
            node -e "
              const fs = require('fs');
              try {
                const results = JSON.parse(fs.readFileSync('python-bridge/scrape-results.json', 'utf8'));
                console.log('Total jobs found: ' + results.totalJobs);
                console.log('Duration: ' + results.duration + ' seconds');
                console.log('\\nSource statistics:');
                for (const source in results.sourceStats) {
                  console.log('- ' + source + ': ' + results.sourceStats[source].jobsFound + ' jobs, ' + 
                              results.sourceStats[source].errors + ' errors');
                }
                console.log('\\nErrors: ' + results.errors.length);
              } catch(e) {
                console.error('Error parsing results:', e.message);
              }
            " >> logs/summary.log
          fi
          
          # Try to get job count from MongoDB
          echo "" >> logs/summary.log
          echo "=== MONGODB STATUS ===" >> logs/summary.log
          node -e "
            require('dotenv').config();
            const { MongoClient } = require('mongodb');
            async function checkCount() {
              try {
                const client = new MongoClient(process.env.MONGODB_URI);
                await client.connect();
                const db = client.db();
                const count = await db.collection('jobs').countDocuments();
                console.log('Total jobs in database: ' + count);
                await client.close();
              } catch(e) {
                console.error('Error checking job count:', e.message);
              }
            }
            checkCount().catch(console.error);
          " 2>&1 >> logs/summary.log
          
          # Output summary to console
          cat logs/summary.log
      
      # Upload logs as artifacts
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            python-bridge/*.log
          retention-days: 7
          if-no-files-found: warn
      
      # Create an empty results directory if it doesn't exist
      - name: Ensure results directory exists
        if: always()
        run: |
          mkdir -p results
          # Create a dummy file if no results exist
          if [ ! -f "python-bridge/scrape-results.json" ]; then
            echo '{"info": "No jobs found in this run", "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > results/empty-results.json
          fi
      
      # Upload results as artifacts
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: results/
          retention-days: 1
          if-no-files-found: warn 