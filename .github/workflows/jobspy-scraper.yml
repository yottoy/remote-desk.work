name: JobSpy Scraper

on:
  # Run on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'

jobs:
  scrape-indeed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      # Set up Python environment for JobSpy bridge
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # Create log directories
      - name: Create log and result directories
        run: |
          mkdir -p logs
          mkdir -p python-bridge/logs
          mkdir -p results
          touch logs/scraper.log
          touch python-bridge/jobspy_bridge.log
      
      # Install Python dependencies for JobSpy bridge
      - name: Install Python dependencies
        run: |
          cd python-bridge
          pip install -r requirements.txt
          
          # Rename the bridge file if it exists with the old name
          if [ -f "indeed_bridge.py" ] && [ ! -f "jobspy_bridge.py" ]; then
            cp indeed_bridge.py jobspy_bridge.py
          fi
      
      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci
      
      # Configure environment
      - name: Setup environment variables
        run: |
          echo "ENABLE_JOBSPY_INDEED=true" >> .env
          echo "ENABLE_JOBSPY_LINKEDIN=true" >> .env
          echo "ENABLE_JOBSPY_GLASSDOOR=true" >> .env
          echo "ENABLE_JOBSPY_GOOGLE=true" >> .env
          echo "ENABLE_JOBSPY_ZIPRECRUITER=true" >> .env
          echo "ENABLE_JOBSPY_BAYT=true" >> .env
          echo "ENABLE_JOBSPY_NAUKRI=true" >> .env
          echo "JOBSPY_BRIDGE_URL=http://0.0.0.0:8000" >> .env
          echo "JOBSPY_BRIDGE_HOST=0.0.0.0" >> .env
          echo "JOBSPY_BRIDGE_PORT=8000" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          echo "LOG_LEVEL=debug" >> .env
      
      # Run JobSpy Indeed scraper
      - name: Run JobSpy scraper
        run: |
          # Record start time
          echo "Starting JobSpy scraper at $(date)" | tee -a logs/scraper.log
          
          # Run the scraper and capture output
          node src/index.js 2>&1 | tee -a logs/scraper.log
          
          # Record completion
          echo "JobSpy scraper completed at $(date)" | tee -a logs/scraper.log
          
          # Create a results summary
          echo "=== SCRAPING RESULTS SUMMARY ===" > logs/summary.log
          echo "Scraper run completed at: $(date)" >> logs/summary.log
          
          # Try to get job count from MongoDB if possible
          echo "Checking MongoDB for job count..." >> logs/summary.log
          node -e "require('dotenv').config(); const { MongoClient } = require('mongodb'); async function checkCount() { try { const client = new MongoClient(process.env.MONGODB_URI); await client.connect(); const db = client.db(); const count = await db.collection('jobs').countDocuments(); console.log('Total jobs in database: ' + count); } catch(e) { console.error('Error checking job count:', e.message); } finally { process.exit(0); } }; checkCount();" 2>&1 | tee -a logs/summary.log
      
      # Upload logs as artifacts - Updated to v4
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            python-bridge/*.log
          retention-days: 7
          if-no-files-found: warn
      
      # Upload results as artifacts (if in debug mode) - Updated to v4
      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: results/
          retention-days: 1
          if-no-files-found: warn 