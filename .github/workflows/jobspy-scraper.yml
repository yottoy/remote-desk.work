name: JobSpy Scraper

on:
  # Run on schedule (reduced frequency to save storage)
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC (reduced from every 24 hours)
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'
      use_proxies:
        description: 'Use proxies from secrets'
        required: false
        default: 'false'

jobs:
  scrape-indeed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Skip artifact caching to save storage
      # - name: Set up Node.js  
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '18'
      #     cache: 'npm'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # Set up Python environment for JobSpy bridge
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # cache: 'pip'  # Disabled to save storage
      
      # Create minimal log directories
      - name: Create essential directories
        run: |
          mkdir -p logs
          mkdir -p python-bridge/logs
          mkdir -p results
      
      # Install Python dependencies for JobSpy bridge
      - name: Install Python dependencies
        run: |
          cd python-bridge
          pip install -r requirements.txt
      
      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci
      
      # Configure proxies if enabled
      - name: Configure proxies
        if: github.event.inputs.use_proxies == 'true'
        run: |
          cd python-bridge
          echo "${{ secrets.PROXY_LIST }}" > proxies.txt
          echo "USE_PROXIES=true" >> .env
          echo "Proxies configured successfully"
      
      # Configure environment
      - name: Setup environment variables
        run: |
          # Global env vars
          echo "ENABLE_JOBSPY_INDEED=true" >> .env
          echo "ENABLE_JOBSPY_LINKEDIN=true" >> .env
          echo "ENABLE_JOBSPY_NAUKRI=true" >> .env
          echo "JOBSPY_BRIDGE_URL=http://127.0.0.1:8000" >> .env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
          # Reduced logging to save storage
          echo "LOG_LEVEL=info" >> .env
          
          # Create .env file for Python bridge
          cd python-bridge
          echo "JOBSPY_BRIDGE_HOST=127.0.0.1" >> .env
          echo "JOBSPY_BRIDGE_PORT=8000" >> .env
          echo "MAX_RETRY_ATTEMPTS=3" >> .env
          echo "RETRY_DELAY=5" >> .env 
          echo "MIN_REQUEST_INTERVAL=2.5" >> .env
          echo "USE_RANDOM_USER_AGENTS=true" >> .env
          echo "DISABLE_PYDANTIC_VALIDATION_WARNINGS=true" >> .env
          
          # If not using proxies, explicitly set to false
          if [ "${{ github.event.inputs.use_proxies }}" != "true" ]; then
            echo "USE_PROXIES=false" >> .env
          fi
      
      # Modify the scrape-all-jobs.js to ensure it uses the correct URL
      - name: Update connection settings
        run: |
          # Force IPv4 in the scrape-all-jobs.js file
          sed -i 's/const API_HOST = process.env.JOBSPY_BRIDGE_URL || .*/const API_HOST = process.env.JOBSPY_BRIDGE_URL || "http:\/\/127.0.0.1:8000";/' python-bridge/scrape-all-jobs.js
          
          # Ensure Python is using IPv4
          cd python-bridge
          # Modify jobspy_bridge.py to bind to both IPv4 and IPv6
          if grep -q "uvicorn.run" jobspy_bridge.py; then
            sed -i 's/uvicorn.run(app, host=host, port=port)/uvicorn.run(app, host=host, port=port, log_level="warning")/' jobspy_bridge.py
          fi
      
      # Run JobSpy bridge in background
      - name: Start JobSpy bridge
        run: |
          cd python-bridge
          python jobspy_bridge.py > /dev/null 2>&1 &
          echo $! > bridge_pid.txt
          
          # Wait for bridge to start up
          sleep 15 
          
          # Check if bridge is running
          if curl -s http://127.0.0.1:8000/health > /dev/null; then
            echo "Bridge started successfully!"
          else
            echo "Bridge failed to start"
            exit 1
          fi
        timeout-minutes: 5
      
      # Run the main scraper with minimal logging
      - name: Run JobSpy scraper
        run: |
          cd python-bridge
          
          echo "Starting JobSpy scraper at $(date)"
          
          # Run scrapers with reduced output
          echo "=== Running JobSpy Scraper ===" 
          JOBSPY_BRIDGE_URL=http://127.0.0.1:8000 node ../scrape-all-jobs.js > ../logs/scraper.log 2>&1
          
          echo "=== Running Alternative Sites Scraper ===" 
          JOBSPY_BRIDGE_URL=http://127.0.0.1:8000 node ../scrape-alt-sites.js >> ../logs/scraper.log 2>&1
          
          echo "=== Running WeWorkRemotely RSS Scraper ===" 
          node ../scrape-weworkremotely.js >> ../logs/scraper.log 2>&1
          
          echo "=== Combining Results ===" 
          node ../run-all-scrapers.js >> ../logs/scraper.log 2>&1
          
          echo "JobSpy scraper completed at $(date)"
          
          # Copy only essential results
          for file in combined-results.json; do
            if [ -f "../$file" ]; then
              cp "../$file" ../results/
            fi
          done
        timeout-minutes: 30
      
      # Update MongoDB with job results
      - name: Update MongoDB with results
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "Importing jobs to MongoDB..."
          
          # Check if combined results file exists
          if [ -f "results/combined-results.json" ]; then
            # Import jobs to MongoDB using existing script
            node import-scraper-to-mongodb.js --overwrite 2>&1 | head -20
            echo "MongoDB import completed"
          else
            echo "No results file found. Skipping MongoDB import."
          fi
      
      # Database cleanup to prevent quota issues
      - name: Cleanup old jobs
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "🧹 Running database cleanup..."
          node scripts/periodic-database-cleanup.js --max-age=45 || echo "⚠️ Cleanup failed but continuing"
      
      # Stop the bridge process
      - name: Stop JobSpy bridge
        if: always()
        run: |
          if [ -f "python-bridge/bridge_pid.txt" ]; then
            PID=$(cat python-bridge/bridge_pid.txt)
            kill $PID || true
          else
            pkill -f "python jobspy_bridge.py" || true
          fi
      
      # Create minimal summary
      - name: Create summary  
        if: always()
        run: |
          echo "Scraper run completed at: $(date)"
          if [ -f "results/combined-results.json" ]; then
            echo "✅ Results file created successfully"
          else
            echo "❌ No results file found"
          fi 