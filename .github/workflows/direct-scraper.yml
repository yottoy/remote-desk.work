name: Main Job Scraper

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/direct-scraper.yml'  # Only run when this workflow is updated
  schedule:
    - cron: '0 10 * * *'  # Daily at 10 AM UTC

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Environment diagnostics
        run: |
          echo "🔧 Environment Setup"
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "Current directory: $(pwd)"
          echo "GitHub runner: $RUNNER_OS"
      
      - name: Create directories
        run: |
          mkdir -p results logs
          chmod -R 777 results logs
          echo "✅ Created results and logs directories"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy==1.1.80 pandas beautifulsoup4 markdownify
          echo "✅ Installed Python dependencies"
      
      - name: Run job scraper
        run: |
          echo "🔍 Starting job scraping..."
          python direct_scraper.py 2>&1 | tee logs/scraper.log
          echo "Scraper exit code: $?"
          
          echo "📊 Results summary:"
          find results -name "*.json" -type f | while read file; do
            jobs_count=$(grep -o '"jobs_count":[^,]*' "$file" 2>/dev/null || echo "0")
            echo "$file: $jobs_count"
          done
      
      - name: Set up Node.js for MongoDB import
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        if: success()
        run: npm ci

      - name: Import results to MongoDB
        if: success()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          echo "📥 Starting MongoDB import..."
          result_files=$(find results -name "*results*.json" -size +100c | head -5)
          
          if [ -z "$result_files" ]; then
            echo "⚠️  No significant result files found to import"
          else
            echo "📋 Found result files to import:"
            echo "$result_files"
            
            node import-scraper-to-mongodb.js --overwrite 2>&1 | tee logs/mongodb-import.log
            import_exit_code=$?
            
            if [ $import_exit_code -eq 0 ]; then
              echo "✅ Successfully imported jobs to MongoDB!"
            else
              echo "❌ MongoDB import failed with exit code: $import_exit_code"
            fi
          fi

      - name: Database cleanup
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "🧹 Running database cleanup..."
          node scripts/periodic-database-cleanup.js --max-age=45 || echo "⚠️ Cleanup completed with warnings" 