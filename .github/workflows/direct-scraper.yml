name: Main Job Scraper

on:
  workflow_dispatch:  # Manual trigger button
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours (00:00 and 12:00 UTC)

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Environment diagnostics
        run: |
          echo "🔧 Environment Setup"
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "Current directory: $(pwd)"
          echo "GitHub runner: $RUNNER_OS"
      
      - name: Create directories
        run: |
          mkdir -p results logs
          chmod -R 777 results logs
          echo "✅ Created results and logs directories"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy==1.1.80 pandas beautifulsoup4 markdownify
          echo "✅ Installed Python dependencies"
      
      - name: Run job scraper
        run: |
          echo "🔍 Starting job scraping..."
          python direct_scraper.py 2>&1 | tee logs/scraper.log
          echo "Scraper exit code: $?"
          
          echo "📊 Results summary:"
          find results -name "*.json" -type f | while read file; do
            jobs_count=$(grep -o '"jobs_count":[^,]*' "$file" 2>/dev/null || echo "0")
            echo "$file: $jobs_count"
          done
          
          # Copy scrape-results.json to root for combining
          if [ -f "results/scrape-results.json" ]; then
            cp results/scrape-results.json scrape-results.json
            echo "✅ Copied scrape-results.json to root directory"
          fi
      
      - name: Set up Node.js for additional scrapers
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        if: success()
        run: npm ci

      - name: Run RSS-based scrapers
        continue-on-error: true
        run: |
          echo "🌐 Running additional RSS-based scrapers..."
          
          # WeWorkRemotely scraper
          echo "📡 Running WeWorkRemotely scraper..."
          node scrape-weworkremotely.js 2>&1 | tee logs/weworkremotely-scraper.log
          wwr_exit=$?
          if [ $wwr_exit -eq 0 ]; then
            echo "✅ WeWorkRemotely scraper completed successfully"
          else
            echo "⚠️ WeWorkRemotely scraper failed with exit code: $wwr_exit"
          fi
          
          # RemoteOK scraper
          echo "📡 Running RemoteOK scraper..."
          node scrape-remoteok.js 2>&1 | tee logs/remoteok-scraper.log
          remoteok_exit=$?
          if [ $remoteok_exit -eq 0 ]; then
            echo "✅ RemoteOK scraper completed successfully"
          else
            echo "⚠️ RemoteOK scraper failed with exit code: $remoteok_exit"
          fi
          
          # Remotive scraper
          echo "📡 Running Remotive scraper..."
          node scrape-remotive.js 2>&1 | tee logs/remotive-scraper.log
          remotive_exit=$?
          if [ $remotive_exit -eq 0 ]; then
            echo "✅ Remotive scraper completed successfully"
          else
            echo "⚠️ Remotive scraper failed with exit code: $remotive_exit"
          fi
          
          echo "📊 RSS scrapers completed"
          echo "Results files created:"
          ls -lh weworkremotely-results.json remoteok-results.json remotive-results.json 2>/dev/null || echo "Some result files may not exist"

      - name: Combine all scraper results
        if: success()
        run: |
          echo "🔄 Combining results from all scrapers..."
          node combine-scraper-results.js 2>&1 | tee logs/combine-results.log
          
          if [ -f "combined-results.json" ]; then
            total_jobs=$(grep -o '"total":[^,}]*' combined-results.json | head -1 | cut -d':' -f2 || echo "0")
            echo "✅ Combined results created with $total_jobs jobs"
          else
            echo "⚠️ Combined results file not created"
          fi

      - name: Import results to MongoDB
        if: success()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          echo "📥 Starting MongoDB import..."
          result_files=$(find results -name "*results*.json" -size +100c | head -5)
          
          if [ -z "$result_files" ]; then
            echo "⚠️  No significant result files found to import"
          else
            echo "📋 Found result files to import:"
            echo "$result_files"
            
            node import-scraper-to-mongodb.js --overwrite 2>&1 | tee logs/mongodb-import.log
            import_exit_code=$?
            
            if [ $import_exit_code -eq 0 ]; then
              echo "✅ Successfully imported jobs to MongoDB!"
            else
              echo "❌ MongoDB import failed with exit code: $import_exit_code"
            fi
          fi

      - name: Database cleanup
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "🧹 Running database cleanup..."
          node scripts/periodic-database-cleanup.js --max-age=45 || echo "⚠️ Cleanup completed with warnings" 