name: Test MongoDB Connection

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode'
        required: false
        default: 'false'

jobs:
  test-mongodb:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Diagnostic information
      - name: System diagnostic info
        run: |
          echo "Runner hostname: $(hostname)"
          echo "Network info:"
          ip addr
          echo "DNS resolver:"
          cat /etc/resolv.conf
          echo "Node.js version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "MongoDB packages:"
          npm list mongodb mongoose
      
      # Debug GitHub secrets presence
      - name: Check for MongoDB URI secret
        run: |
          if [ -n "${{ secrets.MONGODB_URI }}" ]; then
            echo "MONGODB_URI secret is set (value hidden for security)"
            # Print first few characters to verify format without exposing credentials
            URI="${{ secrets.MONGODB_URI }}"
            echo "URI starts with: ${URI:0:10}..."
            if [[ "$URI" == mongodb* ]]; then
              echo "URI has correct prefix format"
            else
              echo "WARNING: URI does not start with 'mongodb'"
            fi
          else
            echo "ERROR: MONGODB_URI secret is NOT set in GitHub repository secrets"
          fi
      
      # Create MongoDB test script
      - name: Create test script
        run: |
          cat > test-mongodb.js << 'EOF'
          require('dotenv').config();
          const { MongoClient } = require('mongodb');

          async function testMongoConnection() {
            console.log('=== MongoDB Connection Diagnostics ===');
            
            const uri = process.env.MONGODB_URI;
            if (!uri) {
              console.error('ERROR: MONGODB_URI not provided in environment variables');
              return false;
            }
            
            console.log('MongoDB URI exists:', !!uri);
            
            // Basic URI format validation
            if (!uri.startsWith('mongodb')) {
              console.error('ERROR: MONGODB_URI does not start with "mongodb" prefix');
              console.error('URI starts with:', uri.substring(0, 10) + '...');
              return false;
            }
            
            console.log('URI format appears valid');
            console.log('URI begins with:', uri.substring(0, 10) + '...');
            
            let client;
            try {
              console.log('Creating MongoDB client...');
              client = new MongoClient(uri);
              
              console.log('Attempting to connect...');
              await client.connect();
              console.log('✅ Successfully connected to MongoDB');
              
              try {
                // Get database info
                console.log('Retrieving database information...');
                const adminDb = client.db().admin();
                const dbInfo = await adminDb.listDatabases();
                
                console.log('Available databases:');
                dbInfo.databases.forEach(db => {
                  console.log(`- ${db.name} (${db.sizeOnDisk} bytes)`);
                });
                
                // Get current database name
                const db = client.db();
                console.log('Current database:', db.databaseName);
                
                // List collections
                const collections = await db.listCollections().toArray();
                
                if (collections.length === 0) {
                  console.log('No collections found in current database');
                } else {
                  console.log('Collections in current database:');
                  collections.forEach(collection => {
                    console.log(`- ${collection.name}`);
                  });
                }
                
                // Create test document
                console.log('Creating test document...');
                const testCollection = db.collection('connection_tests');
                const result = await testCollection.insertOne({
                  test_id: new Date().toISOString(),
                  message: 'GitHub Actions test',
                  timestamp: new Date()
                });
                console.log(`Inserted test document with ID: ${result.insertedId}`);
                
                // Check for jobs collection
                if (collections.some(c => c.name === 'jobs')) {
                  const jobsCollection = db.collection('jobs');
                  const jobCount = await jobsCollection.countDocuments();
                  console.log('Number of jobs in the database:', jobCount);
                } else {
                  console.log('No jobs collection found - this indicates the scraper has not run successfully yet');
                }
                
              } catch (error) {
                console.error('Error during database operations:', error.message);
                if (error.message.includes('not authorized') || error.message.includes('auth failed')) {
                  console.error('Authentication error - please check MongoDB username and password');
                }
                return false;
              }
              
              return true;
            } catch (error) {
              console.error(`MongoDB connection error: ${error.message}`);
              
              // Detailed error diagnostics
              if (error.message.includes('ENOTFOUND')) {
                console.error('Host not found error - check hostname in MongoDB URI');
              } else if (error.message.includes('ETIMEDOUT')) {
                console.error('Connection timeout - check network connectivity and firewall settings');
              } else if (error.message.includes('authentication failed')) {
                console.error('Authentication error - check username and password');
              } else if (error.message.includes('ssl')) {
                console.error('SSL/TLS error - check SSL configuration');
              }
              
              return false;
            } finally {
              if (client) {
                console.log('Closing MongoDB connection...');
                await client.close();
                console.log('Connection closed');
              }
            }
          }

          testMongoConnection()
            .then(success => {
              if (success) {
                console.log('✅ MongoDB connection test completed successfully');
                process.exit(0);
              } else {
                console.error('❌ MongoDB connection test failed');
                process.exit(1);
              }
            })
            .catch(error => {
              console.error('Unhandled error:', error);
              process.exit(1);
            });
          EOF
      
      # Set up environment variables
      - name: Set up environment
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > .env
      
      # Run MongoDB ping test if possible
      - name: MongoDB connectivity test
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          # Extract host from URI if possible (simplified, doesn't handle all URI formats)
          URI="${{ secrets.MONGODB_URI }}"
          if [[ "$URI" == mongodb* ]]; then
            # Very basic extraction, will miss authentication details and other complexities
            HOST=$(echo "$URI" | sed -E 's|mongodb(\+srv)?://([^:@/]+:[^@/]+@)?([^:/]+).*|\3|')
            if [[ -n "$HOST" ]]; then
              echo "Attempting to ping MongoDB host: $HOST"
              ping -c 3 "$HOST" || echo "Ping failed or not supported"
            fi
          fi
      
      # Run the test
      - name: Test MongoDB connection
        run: node test-mongodb.js
        
      # Upload test results as artifacts (even on failure)
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-test-results
          path: .env
          retention-days: 1 