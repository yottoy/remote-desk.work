name: Run Job Scrapers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'  # Run every 12 hours

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Create log directories
        run: |
          mkdir -p logs
          touch logs/debug.log
          touch logs/scraper.log
          chmod 777 logs
          echo "Created logs directory and placeholder log files"
          ls -la logs/
      
      - name: Environment diagnostics
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Python version: $(python --version)"
          echo "Pip version: $(pip --version)"
          echo "Current directory: $(pwd)"
          echo "Directory contents: $(ls -la)"
          echo "Networking: $(ip addr || ifconfig || echo 'Network commands not available')"
          echo "Environment diagnostics completed" > logs/environment.log
          
      - name: Install Node.js dependencies
        run: npm ci
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install dependencies verbosely to see any errors
          pip install -v pandas uvicorn fastapi jobspy python-dotenv
          pip list | grep -E "pandas|uvicorn|fastapi|jobspy|python-dotenv" | tee logs/pip-packages.log
      
      - name: Test GitHub environment
        run: node test-github-environment.js 2>&1 | tee logs/github-environment.log
      
      - name: Prepare for bridge
        run: |
          # Make sure we have the needed directories
          touch logs/bridge-prep.log
          # Create a simple .env file
          echo "JOBSPY_BRIDGE_URL=http://127.0.0.1:8000" > .env
          echo "JOBSPY_BRIDGE_HOST=127.0.0.1" >> .env
          echo "JOBSPY_BRIDGE_PORT=8000" >> .env
          echo "Created .env file with bridge configuration" | tee -a logs/bridge-prep.log
      
      - name: Start JobSpy bridge in background
        run: |
          echo "Starting JobSpy bridge..." | tee logs/bridge-start.log
          # Force IPv4 for the Python server
          python -c "import socket; socket.setdefaulttimeout(10); print('IPv4 address:', socket.gethostbyname('localhost'))" | tee -a logs/bridge-start.log
          
          # Start bridge with detailed logging
          python jobspy_bridge.py > logs/jobspy_bridge_output.log 2>&1 &
          echo $! > logs/bridge_pid.txt
          
          # Wait for bridge to start
          echo "Waiting for bridge to start..." | tee -a logs/bridge-start.log
          sleep 15  # Give more time to start
          
          # Check if bridge process is running
          if ps -p $(cat logs/bridge_pid.txt) > /dev/null; then
            echo "Bridge process is running" | tee -a logs/bridge-start.log
          else
            echo "Bridge process is NOT running!" | tee -a logs/bridge-start.log
            cat logs/jobspy_bridge_output.log | tee -a logs/bridge-start.log
            # Don't exit here, continue to collect diagnostic info
          fi
          
          # Check if bridge is listening on port
          if netstat -tuln | grep 8000; then
            echo "Port 8000 is open" | tee -a logs/bridge-start.log
          else
            echo "Port 8000 is NOT open!" | tee -a logs/bridge-start.log
            # Don't exit here, continue to collect diagnostic info
          fi
      
      - name: Test bridge connection
        run: |
          node test-bridge.js 2>&1 | tee logs/test-bridge.log || true
      
      - name: Run Indeed scraper with debug
        continue-on-error: true  # Don't stop on error, collect logs first
        run: |
          echo "Starting Indeed scraper..." | tee logs/indeed-scraper.log
          node --trace-warnings scrape-indeed.js 2>&1 | tee -a logs/indeed-scraper.log
          echo "Indeed scraper exit code: $?" | tee -a logs/indeed-scraper.log
      
      - name: Run all scrapers
        continue-on-error: true  # Don't stop on error, collect logs first
        run: |
          echo "Starting all scrapers..." | tee logs/all-scrapers.log
          node --trace-warnings run-all-scrapers.js 2>&1 | tee -a logs/all-scrapers.log
          echo "All scrapers exit code: $?" | tee -a logs/all-scrapers.log
      
      - name: Dump system state for debugging
        run: |
          echo "==== Process List ====" | tee logs/system-state.log
          ps aux | grep -E "node|python" | tee -a logs/system-state.log
          echo "==== Network Connections ====" | tee -a logs/system-state.log
          netstat -tuln | tee -a logs/system-state.log
          echo "==== Directory Contents ====" | tee -a logs/system-state.log
          find . -type f -name "*.log" | tee -a logs/system-state.log
          find . -type f -name "*.json" | tee -a logs/system-state.log
      
      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            *.json
            results/*.json
          if-no-files-found: ignore
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            logs/
            *.log
            **/*.log
          if-no-files-found: warn 